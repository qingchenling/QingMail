[workspace]
resolver = "3"
members = [
    "crates/mail-core",
    "crates/mail-protocol",
    "crates/mail-content",
    "crates/mail-storage",
    "crates/mail-service",
    "crates/mail-daemon",
    "crates/mail-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
# 内部 crate：依赖方向见主文档 §3.1、§8.1，后台核心不得依赖 UI。
mail-core = { path = "crates/mail-core" }
mail-protocol = { path = "crates/mail-protocol" }
mail-content = { path = "crates/mail-content" }
mail-storage = { path = "crates/mail-storage" }
mail-service = { path = "crates/mail-service" }

# UI 框架。版本精确 pin（ADR-0001）：上游已有浮动快照导致编译失败的先例。
gpui-kit = "=0.9.1"
# Material 层：关闭默认 feature 中的 gpui-fast，与 gpui-kit 默认的上游
# snapshot 后端保持一致；按需启用组件组。
gpui-kit-material = { version = "=0.1.4", default-features = false, features = [
    "full",
    "serde",
    "embedded-symbols",
] }
# 性能 HUD：帧率、帧耗时、GPU/CPU/内存。与 gpui-kit 同步升级以保证
# gpui-pre 快照一致。
gpui-fps = "=0.9.1"

# P0 内容验证：邮件/HTML/CSS 均通过解析器处理，不能使用正则承担安全边界。
mail-parser = { version = "=1.0.1", features = ["full_encoding"] }
ammonia = "=4.2.5"
scraper = { version = "=0.29.0", default-features = false }
cssparser = { version = "=0.38.0", default-features = false }
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
url = "=2.5.8"
percent-encoding = "=2.3.2"
getrandom = "=0.4.3"
rustix = { version = "=1.1.6", features = ["fs", "process", "net"] }
tempfile = "=3.27.0"
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "backup"] }
sha2 = "=0.10.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }

zbus = "=5.19.0"

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ropey = "=2.0.0-beta.1"

[profile.release]
lto = "thin"
