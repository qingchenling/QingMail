<div id="qingmail-design">
<style>
#qingmail-design{--qm-bg:light-dark(#f8f9f5,#111511);--qm-panel:light-dark(#fff,#171c17);--qm-nav:light-dark(#edf0e8,#1b211b);--qm-text:light-dark(#1a211a,#e2e9df);--qm-muted:light-dark(#485547,#b8c5b5);--qm-primary:light-dark(#32633d,#9cd3a0);--qm-on:light-dark(#fff,#063914);--qm-selected:light-dark(#d8ebd5,#29492d);--qm-line:light-dark(#c2cbbd,#424d40);font:14px/1.55 'Noto Sans',sans-serif;color:var(--qm-text);background:var(--qm-bg);border-radius:18px;overflow:clip;color-scheme:light dark}
#qingmail-design *{box-sizing:border-box}#qingmail-design button,#qingmail-design input,#qingmail-design select,#qingmail-design textarea{font:inherit;color:inherit}#qingmail-design button{background:var(--qm-panel);border:1px solid var(--qm-line);padding:7px 12px;border-radius:18px;cursor:default}#qingmail-design button:hover{background:var(--qm-selected)}#qingmail-design button.primary{background:var(--qm-primary);color:var(--qm-on);border-color:transparent}#qingmail-design button[aria-pressed=true]{background:var(--qm-selected)}#qingmail-design header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--qm-line);padding-right:100px}#qingmail-design header strong{font-size:18px}#qingmail-design .shell{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:560px}#qingmail-design nav{padding:18px 10px;background:var(--qm-nav);display:flex;flex-direction:column;gap:7px}#qingmail-design nav button{text-align:left;background:transparent;border-color:transparent}#qingmail-design nav .primary{margin-bottom:15px}#qingmail-design .muted{color:var(--qm-muted)}#qingmail-design .small{font-size:12px}#qingmail-design main{min-width:0}#qingmail-design .split{display:grid;grid-template-columns:minmax(235px,0.9fr) minmax(0,1.3fr)}#qingmail-design .list{border-right:1px solid var(--qm-line)}#qingmail-design .list>div{padding:16px}#qingmail-design .mail{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--qm-line);padding:14px 16px;background:transparent}#qingmail-design .mail span{display:block;overflow-wrap:anywhere}#qingmail-design .mail.active{background:var(--qm-selected)}#qingmail-design .page,#qingmail-design article{padding:24px;min-width:0;overflow-wrap:anywhere}#qingmail-design h2{font-size:22px;line-height:1.4;margin:12px 0}#qingmail-design p{margin:12px 0}#qingmail-design .tools{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}#qingmail-design .notice{padding:12px 14px;background:var(--qm-nav);border-radius:12px;margin:14px 0}#qingmail-design label{display:block;margin:12px 0}#qingmail-design input,#qingmail-design textarea,#qingmail-design select{display:block;width:100%;background:var(--qm-panel);border:1px solid var(--qm-line);border-radius:8px;padding:10px;margin-top:5px;min-width:0}#qingmail-design textarea{min-height:170px;resize:vertical}#qingmail-design .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}#qingmail-design footer{border-top:1px solid var(--qm-line);padding:10px 20px;color:var(--qm-muted);font-size:12px}#qingmail-design .back{display:none}#qingmail-design .hidden{display:none!important}#qingmail-design.narrow .shell{grid-template-columns:1fr}#qingmail-design.narrow nav{display:none}#qingmail-design.narrow .split{grid-template-columns:1fr}#qingmail-design.narrow .split article{display:none}#qingmail-design.narrow.reading .list{display:none}#qingmail-design.narrow.reading .split article{display:block}#qingmail-design.narrow .back{display:inline-block}#qingmail-design.narrow.menu nav{display:flex}
@media(max-width:850px){#qingmail-design .shell{grid-template-columns:1fr}#qingmail-design nav{display:none}#qingmail-design.menu nav{display:flex}#qingmail-design .back{display:inline-block}}@media(max-width:650px){#qingmail-design .split{grid-template-columns:1fr}#qingmail-design .split article{display:none}#qingmail-design.reading .list{display:none}#qingmail-design.reading .split article{display:block}#qingmail-design .fields{grid-template-columns:1fr}#qingmail-design header{padding:14px;padding-right:90px}#qingmail-design .page,#qingmail-design article{padding:16px}}
</style>
<header><strong>QingMail</strong><button data-action="menu" class="back" aria-label="打开导航">导航</button><span class="muted small">产品设计 · 合成数据</span><button data-action="theme">切换明暗</button><button data-action="width">窄窗预览</button></header>
<div class="shell"><nav aria-label="邮箱导航"><button class="primary" data-page="compose">＋ 写信</button><span class="small muted">lingchen@example.org</span><button data-page="inbox">收件箱　3</button><button data-page="drafts">草稿　1</button><button data-page="tasks">发送任务　2</button><button data-page="search">搜索</button><button data-page="account">添加 / 管理账号</button><button data-page="settings">设置</button></nav><main></main></div><footer aria-live="polite">设计评审模式 · 不会登录、保存真实草稿或发送邮件</footer>
<script>
(()=>{const root=document.getElementById('qingmail-design'),main=root.querySelector('main'),foot=root.querySelector('footer');const saved=window.openai?.widgetState?.modelContent;const state={page:saved?.page||'inbox',narrow:false,dark:null,mail:0,remote:false,plain:false,task:'结果不确定',draft:'你好，\n\n已收到安排。我会在周五前整理验证结果。\n\n凌晨',subject:'Re: 周五的项目评审',bodySize:16};
const mails=[['陈雨','周五的项目评审','请确认时间与附件内容','10:24'],['开源社区','十一月更新与活动安排','远程图片已默认阻止','昨天'],['设备通知','（无主题）','这封邮件仅包含纯文本','周一']];
const btn=(label,action,cls='')=>`<button class="${cls}" data-action="${action}">${label}</button>`;
const notice=text=>`<div class="notice">${text}</div>`;
function remember(){window.openai?.setWidgetState?.({modelContent:{page:state.page},privateContent:null})?.catch(()=>{});}
function render(){root.classList.toggle('narrow',state.narrow);root.style.colorScheme=state.dark===null?'light dark':state.dark?'dark':'light';root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===state.page)));const m=mails[state.mail];
if(state.page==='inbox')main.innerHTML=`<div class="split"><section class="list" aria-label="邮件列表"><div><strong>收件箱</strong><br><span class="small muted">刚刚同步 · 3 封邮件</span></div>${mails.map((x,i)=>`<button class="mail ${i===state.mail?'active':''}" data-mail="${i}"><span>${x[0]} <small class="muted">${x[3]}</small></span><span><strong>${x[1]}</strong></span><span class="muted small">${x[2]}</span></button>`).join('')}</section><article><button class="back" data-action="back">返回列表</button><div class="small muted">简化阅读 · ${state.plain?'纯文本':'HTML 简化版'}</div><h2>${m[1]}</h2><p>${m[0]} &lt;sender@example.org&gt;<br><span class="small muted">收件人：凌晨 · 2026年11月16日 ${m[3]}</span></p><div class="tools">${btn('回复','reply')}${btn('转发','forward')}${btn('纯文本切换','plain')}${btn('字号 +','size')}</div>${notice(state.remote?'已为此邮件授权远程图片（预览不请求资源）':'已阻止远程图片，加载可能暴露阅读行为。'+btn('仅此邮件加载','remote'))}<div style="font-size:${state.bodySize}px"><p>凌晨，你好：</p><p>我们计划在周五下午进行项目评审。请带上阅读、草稿和异常发送流程的验证结果。</p><p>中文与 English 内容都应保持清晰可读。<br>谢谢，期待你的反馈。</p></div><p class="notice">附件 · 评审安排.pdf · 128 KiB ${btn('保存附件','attachment')}</p><div class="tools">${btn('在浏览器中打开','browser')}${btn('删除','delete')}</div></article></div>`;
else if(state.page==='compose')main.innerHTML=`<section class="page"><h2>写信</h2><label>收件人<input value="chenyu@example.org" aria-label="收件人"></label><div class="tools">${btn('展开抄送 / 密送','cc')}</div><div id="qm-cc" hidden><label>抄送<input aria-label="抄送"></label><label>密送<input aria-label="密送"></label></div><label>主题<input id="qm-subject" aria-label="主题"></label><div class="tools">${btn('粗体','format')}${btn('斜体','format')}${btn('列表','format')}${btn('引用','format')}${btn('链接','format')}${btn('添加附件','attachment')}</div><label>正文<textarea id="qm-draft" aria-label="正文"></textarea></label><div class="small muted">格式工具用于评审位置；编辑能力以原生窗口验收为准。</div><div class="tools">${btn('发送','send','primary')}${btn('保存草稿','save')}${btn('模拟离线发送','offline')}</div><div role="status" id="qm-save">草稿预览 · 不写入真实邮箱</div></section>`;
else if(state.page==='tasks'){const text={'待提交':'正在可靠保存发送任务及附件引用。此时尚未联网。','正在发送':'正在交给邮件服务器，请勿重复提交。','发送成功':'邮件已发送。','明确失败':'未发送：认证失败。请检查账号设置。','结果不确定':'服务器可能已收到邮件。QingMail 不会自动重发。','已发副本待保存':'邮件已发送，但已发送文件夹副本尚未保存。'};main.innerHTML=`<section class="page"><h2>发送任务</h2><label>评审异常分支<select id="qm-task">${Object.keys(text).map(t=>`<option ${t===state.task?'selected':''}>${t}</option>`).join('')}</select></label><h3>Re: 周五的项目评审</h3><p class="muted">发往 chenyu@example.org</p>${notice('<strong>'+state.task+'</strong><p>'+text[state.task]+'</p>')}<div class="tools">${state.task==='结果不确定'?btn('查看邮件','view')+btn('查看已发送','sent')+btn('重新发送…','resend')+btn('停止处理','abandon'):state.task==='已发副本待保存'?btn('重试保存副本','copy','primary'):state.task==='明确失败'?btn('修改草稿','reply')+btn('重新发送…','resend'):state.task==='待提交'?btn('取消提交','cancel'):btn('查看邮件','view')}</div><div id="qm-confirm" role="status"></div></section>`;}
else if(state.page==='account')main.innerHTML=`<section class="page"><h2>添加通用邮箱</h2><p class="muted">IMAP / SMTP · Gmail / Outlook OAuth 稍后提供</p><label>邮箱<input value="lingchen@example.org" type="email"></label><div class="fields"><label>IMAP 服务器<input value="imap.example.org"></label><label>SMTP 服务器<input value="smtp.example.org"></label><label>IMAP 加密<select><option>隐式 TLS · 993</option><option>STARTTLS · 143</option></select></label><label>SMTP 加密<select><option>隐式 TLS · 465</option><option>STARTTLS · 587</option></select></label></div><label>用户名<input value="lingchen@example.org"></label><label>密码 / 应用专用密码<input type="password" placeholder="仅示意，不接受真实凭据" disabled></label><div class="tools">${btn('检查连接（模拟）','connect','primary')}${btn('模拟密钥库锁定','keyring')}</div><div id="qm-account-status" role="status"></div></section>`;
else if(state.page==='settings')main.innerHTML=`<section class="page"><h2>设置</h2><label>主题<select id="qm-theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>通知隐私<select><option>仅提示收到新邮件</option><option>仅发件人</option><option>发件人、主题及预览</option><option>关闭</option></select></label><label>缓存上限<select><option>1 GiB（默认）</option><option>2 GiB</option><option>512 MiB</option></select></label><p><input type="checkbox" id="qm-motion" style="display:inline;width:auto"> <label for="qm-motion" style="display:inline">减少动态效果</label></p><p>动画始终遵循系统省电策略。</p><div class="tools">${btn('清理阅读副本','clean')}${btn('查看后台说明','background')}</div><div id="qm-setting-status" role="status"></div></section>`;
else if(state.page==='search')main.innerHTML=`<section class="page"><h2>搜索</h2><label>范围<select><option>当前文件夹 · 收件箱</option><option>当前账号的本地邮件</option></select></label><label>关键词<input id="qm-search" placeholder="搜索发件人或主题"></label><p class="muted">搜索本地缓存，可能不含尚未下载的邮件。</p><div id="qm-results" aria-live="polite"></div></section>`;
else main.innerHTML=`<section class="page"><h2>草稿</h2><button data-action="reply">Re: 周五的项目评审 · 刚刚保存</button><p class="muted">恢复收件人、格式、附件与最后确认保存的版本。</p></section>`;
if(state.page==='compose'){main.querySelector('#qm-draft').value=state.draft;main.querySelector('#qm-subject').value=state.subject;}if(state.page==='settings')main.querySelector('#qm-theme').value=state.dark===null?'system':state.dark?'dark':'light';}
root.addEventListener('input',e=>{if(e.target.id==='qm-draft'){state.draft=e.target.value;main.querySelector('#qm-save').textContent='预览中的改动已保留；切换页面可恢复。';}if(e.target.id==='qm-subject')state.subject=e.target.value;if(e.target.id==='qm-search'){const q=e.target.value.toLowerCase();const matches=mails.filter(x=>x.join(' ').toLowerCase().includes(q));main.querySelector('#qm-results').replaceChildren(...(matches.length?matches.map(x=>{const p=document.createElement('p');p.textContent=x[0]+' · '+x[1];return p;}):[Object.assign(document.createElement('p'),{textContent:'未找到本地邮件。请尝试其他关键词或清空筛选。'})]));}});
root.addEventListener('change',e=>{if(e.target.id==='qm-task'){state.task=e.target.value;render();}if(e.target.id==='qm-theme'){state.dark=e.target.value==='system'?null:e.target.value==='dark';render();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;root.classList.remove('menu','reading');render();remember();return;}if(b.dataset.mail){state.mail=Number(b.dataset.mail);root.classList.add('reading');render();return;}const a=b.dataset.action;switch(a){case'menu':root.classList.toggle('menu');break;case'theme':state.dark=state.dark===null?true:!state.dark;render();break;case'width':state.narrow=!state.narrow;root.classList.remove('reading');render();break;case'back':root.classList.remove('reading');break;case'reply':case'forward':state.page='compose';render();break;case'plain':state.plain=!state.plain;render();break;case'size':state.bodySize=state.bodySize===20?16:state.bodySize+2;render();break;case'remote':state.remote=true;render();break;case'cc':main.querySelector('#qm-cc').hidden=!main.querySelector('#qm-cc').hidden;break;case'send':state.page='tasks';state.task='待提交';render();foot.textContent='模拟流程：先保存发送任务，再进行网络提交。没有真实发送。';break;case'resend':main.querySelector('#qm-confirm').innerHTML=notice('收件人可能已经收到上一封邮件。仍然发送一封新邮件？<div class="tools">'+btn('确认发送一封新邮件','confirm-send','primary')+btn('取消','dismiss')+'</div>');break;case'confirm-send':state.task='待提交';render();foot.textContent='模拟新建发送任务；原任务记录保留。';break;case'dismiss':main.querySelector('#qm-confirm').textContent='已取消，原任务状态保留。';break;case'copy':main.querySelector('#qm-confirm').textContent='模拟：只重试 IMAP 保存副本，不再次 SMTP 发送。';break;case'abandon':main.querySelector('#qm-confirm').textContent='已停止本地后续处理；这不会撤回可能已送达的邮件。';break;case'connect':main.querySelector('#qm-account-status').innerHTML=notice('IMAP / SMTP 模拟检查通过。'+btn('确认保存（模拟）','account-save'));break;case'keyring':main.querySelector('#qm-account-status').textContent='密钥库已锁定。请解锁后重试；不会将密码保存到普通配置。';break;case'account-save':state.page='inbox';render();foot.textContent='模拟账号已添加 · 首次同步不逐封通知。';break;case'sent':main.querySelector('#qm-confirm').textContent='模拟：已打开已发送文件夹；没有找到副本也不能判定未发送。';break;case'view':main.innerHTML='<section class="page"><h2>发送快照（只读）</h2><p>Re: 周五的项目评审</p><p>发往 chenyu@example.org</p><p>你好，已收到安排。我会在周五前整理验证结果。</p>'+btn('返回发送任务','task-back')+'</section>';break;case'task-back':state.page='tasks';render();break;case'cancel':state.page='drafts';render();break;default:const messages={browser:'设计预览：产品将生成安全本地副本并交给系统打开；此处不启动浏览器。',attachment:'设计预览：产品使用系统文件选择器；保存失败保留重试入口。',delete:'设计预览：删除后提供撤销；远端失败恢复原条目。',format:'此处仅评审格式工具布局；请以 GPUI 原生编辑器验证实际格式。',save:'预览已保留当前文字；正式产品显示写盘确认时间。',offline:'离线：草稿保留，联网后请再次点击发送，不会自动发送。',clean:'设计预览：仅清理阅读副本，不删除草稿或发送任务附件。',background:'有托盘时可关闭窗口继续同步；无托盘时提示恢复入口，不静默隐藏。'};foot.textContent=messages[a]||'设计预览';} });render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addToggle(state,'narrow',{label:'窄窗布局'});}
})();
</script>
</div>
